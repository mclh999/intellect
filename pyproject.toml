[project]
name = "intellect"
version = "0.1.0"
description = "Agent 知识库系统：文档导入 → 知识抽取 → 混合检索 → 问答引用 → 审核/纠错 → 版本回滚"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "intellect" }]
dependencies = [
    # Agent 框架（DESIGN 2.1）
    "langchain>=0.3",
    # 中文分词：FTS5 写入与查询统一预分词（DESIGN 7.3）
    "jieba>=0.42",
    # 本地向量索引客户端（DESIGN 2.1"独立向量库/本地向量索引"；选型见 PROBLEM.MD 待评审）
    "chromadb>=0.5",
    # 配置中心加载与校验
    "pydantic>=2.7",
    # PDF / DOCX 文本解析（T2.1，已获用户确认）
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    # SQLite 驱动使用 Python 标准库 sqlite3，无需额外依赖
]

[project.scripts]
intellect = "intellect.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
